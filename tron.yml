#!/usr/bin/env -S stimela run -l

_include:
  - parrot-cabs.yml
  - tron-breifast.yml
  - local-env.yml[optional]

## this augments the standard 'opts' config section to tweak logging settings
opts:
  log:
    dir: logs/log-{config.run.datetime}
    name: log-{info.fqname}
    nest: 2
    symlink: log
  backend:
    select: singularity
    rlimits:
      NOFILE: 100000  # set high limit on number of open files

cabs:
  breifast.make-baseline-image:
    backend:
      select: native
      native:
        virtual_env: ~/.venv/breizorro

  breifast.process-residual-cube:
    backend:
      select: native
      native:
        virtual_env: ~/.venv/breizorro

  breifast.render:
    backend:
      select: native
      native:
        virtual_env: ~/.venv/breizorro

tron:
  name: tron
  info: "Perform transient analysis on precalibrated MS"

  assign:
    log.dir: '{recipe.dir-out}/logs/log-{config.run.datetime}'          # put logs into output dir
    
    # some more default directory assignments
    dirs:
      ms: ../msdir       # MSs live here
      temp: ./tmp        # "{config.run.env.HOME}/tmp"   # temp files go here
      sub: .
      base: .            # base project directory -- directory of recipe by default, but see below

    # extra lightcurve suffix, added if convolving
    lc-suffix: "-{recipe.htc.convolve.arcsec}asec"
    # lc-conv-suffix: "-{recipe.htc.convolve.time:.0f}s{recipe.lc-suffix}"

  assign_based_on:
    _include: tron-observation-sets.yml

  inputs:
    obs:
      info: "Selects observation by label -- edit tron-observation-sets.yml"
      required: true
    dir-out:
      info: output directory where cubes and other products will be generated
      default: '{recipe.dirs.base}/{recipe.dirs.sub}/imhtc-cad{recipe.htc.cadence}'  
    column:
      data: 
        info: corrected visibilities column
        default: CORRECTED_DATA
      model: 
        info: model visibilities column which will be subtracted from data during imaging
        default: MODEL_DATA
      residual: 
        info: residual visibilities column. If set, overrides data and model, and no subtraction will be done
        dtype: str
    deep-image:
      dtype: File
      required: true
      info: deep image of field, required to make a baseline detection image
    htc:
      cadence:
        info: raw cube imaging cadence, in intervals
        dtype: int
        default: 1
      size:
        info: size of cube, in pixels
        dtype: int
        required: true
      scale:
        info: pixel scale of cube, e.g. 2asec
        dtype: str
        required: true
      weight:
        info: imaging weight 
        dtype: Union[str,Tuple[str,float]]
        default: [briggs,0]
      convolve:
        arcsec:
          info: cube will be reconvolved to this size, to maximize point source sensitvity
          dtype: float
          default: 8
        ## disabled for now, rather do breifast-style loop
        # time:
        #   dtype: float
        #   default: 120
    nlc:
      info: number of lightcurves to extract, default is all
      dtype: int
    publish-plots:
      info: make publication-quality lightcurve plots
      dtype: bool
      default: false
    publish-plot-title:
      info: title for publication plots
      default: 'Observation {recipe.obs}: peak $ {{peak_ujy:.0f}}\pm{{peak_std_ujy:.0f}} $ uJy'

    minuv-l:
      info: apply inner uv-cut during imaging (in lambdas)
      aliases:
        - (wsclean).minuv-l
    taper-inner-tukey:
      info: apply inner tukey taper during imaging (in lambdas)
      aliases:
        - (wsclean).taper-inner-tukey

  steps:
    save-ms-info:
      info: extracts and saves MS metadata for further steps
      cab: save-ms-info
      params:
        ms: =recipe.ms
        ms-info-file: '{recipe.ms}.yml'
      skip_if_outputs: exist
      tags: [lightcurves, cubes, always]

    ms-info:
      info: loads MS metadata for further steps
      cab: load-ms-info
      params:
        ms-info-file: =steps.save-ms-info.ms-info-file
      tags: [lightcurves, cubes, always]

    image-htc:
      info: images MS at raw time cadence
      cab: wsclean
      params:
        ms: =recipe.ms
        column: =IFSET(recipe.column.residual, recipe.column.residual, recipe.column.data)
        subtract-model: =not IFSET(recipe.column.residual)
        prefix: '{recipe.dir-out}/images/cad{recipe.htc.cadence}'
        intervals-out: =steps.ms-info.num_intervals / recipe.htc.cadence
        weight: =recipe.htc.weight
        size: =recipe.htc.size
        scale: =recipe.htc.scale
        use-wgridder: true
        no-dirty: true
        log-time: true
        nchan: 1
        niter: 0 
        padding: 3
        nwlayers-factor: 3
        temp-dir: =recipe.dirs.temp
      tags: [lightcurves, cubes]
      skip_if_outputs: fresh

    stack-cube-htc:
      info: stacks images into zarr dataset, applies convolve.size
      cab: stack_xarray_cube
      params:
        images: =steps.image-htc.restored.per-interval
        cube: '{recipe.dir-out}/cube-{recipe.htc.cadence}.zarr'
        ms: =recipe.ms
        obs-label: =recipe.obs
        cadence: =recipe.htc.cadence
        convolved-cube: =STRIPEXT(current.cube) + '{recipe.lc-suffix}.zarr'
        ratio-cube: =STRIPEXT(current.cube) + '.ratio.zarr'
        convolve-arcsec: =recipe.htc.convolve.arcsec
      skip_if_outputs: fresh
      tags: [lightcurves, cubes]

    cube-to-fits:
      info: converts stacked zarr dataset (raw images) into FITS cube
      cab: zarr_to_fits
      params:
        zarr: =steps.stack-cube-htc.cube
        outimage: =current.zarr + '.fits'
      skip_if_outputs: fresh
      tags: [lightcurves, cubes_to_fits, cubes]

    cube-ratio-to-fits:
      info: converts stacked zarr dataset (ratio raw/convolved) into FITS cube
      cab: zarr_to_fits
      params:
        zarr: =steps.stack-cube-htc.ratio-cube
        outimage: =current.zarr + '.fits'
      skip_if_outputs: fresh
      tags: [lightcurves, cubes_to_fits, cubes]

    cube-convolved-to-fits:
      info: converts stacked zarr dataset (convolved images) into FITS cube
      cab: zarr_to_fits
      params:
        zarr: =steps.stack-cube-htc.convolved-cube
        outimage: =current.zarr + '.fits'
      skip_if_outputs: fresh
      tags: [lightcurves, cubes_to_fits, cubes]

    breifast:
      info: runs a multi-timescale breifast search on cubes
      recipe: tron-breifast
      params:
        deep-image: =recipe.deep-image
        cube: =steps.stack-cube-htc.convolved-cube
        cube-fits: =steps.cube-convolved-to-fits.outimage
        timescales: [0,30,60,120,240,480]
      tags: [breifast]

    source-finder:
      info: runs source finder on deep image to make gaul list
      cab: bdsf.catalog
      params:
        image: =recipe.deep-image
        thresh_pix: 4
        thresh_isl: 3
        rms_box: [100,20]
        rms_map: false
        #flagging_opts: true
        #flag_maxsize_bm: 10
        catalog_format: ascii
        outfile_gaul: =STRIPEXT(current.image) + '.gaul'
        outfile_srl: =STRIPEXT(current.image) + '.srl'
      skip_if_outputs: fresh
      tags: [catalog, never]    

    make-master-source-catalog:
      info: converts gaul list into master catalog for lightcurve extraction
      tags: [catalog, never]    
      cab: make-master-catalog
      params:
        master_catalog: =STRIPEXT(recipe.deep-image) + ".mastercat.ecsv"
        mfs_image: =recipe.deep-image
        max_radius_deg: 1.5
        catalogs: 
          base: [=steps.source-finder.outfile_gaul, 0, main]

    extract-lightcurves:
      info: extracts lightcurves from convolved cube using the master catalog
      cab: extract_lightcurves
      params:
        cube: =steps.stack-cube-htc.convolved-cube
        outdir: '{recipe.dir-out}/lc{recipe.htc.cadence}{recipe.lc-suffix}'
        catalog: =steps.make-master-source-catalog.master_catalog
        regfile: '{current.outdir}/lc{recipe.htc.cadence}-{recipe.obs}.reg'
        statsfile: '{current.outdir}/lc{recipe.htc.cadence}-{recipe.obs}.stats.p'
        output_file_label: "-{recipe.obs}"
        srctype: P
        minflux: 3uJy
        flag_excess_std: 3
        within: =recipe.lightcurves-within
        nsrc: =recipe.nlc
        ncpu: =root.ncpu
        # beaminfo: =steps.derive-obs-specific-power-beam.beaminfo
        fluxcols: [flux_base]
        plot_title: =IF(recipe.publish-plots, NOSUBST(recipe.publish-plot-title), UNSET)
      skip_if_outputs: fresh
      tags: [lightcurves, never]

    ## disabling for now -- implement loop rather (maybe in breifast?)
