band:
  UHF:
    htc.size: 3072
    htc.scale: 4.8arcsec
    htc.weight: "briggs 0"
    htc.convolve.arcsec: 16
    # htfc.size: 2048
    # htfc.scale: 4.8arcsec
    # htfc.nband: 8
    lightcurves-within: 1deg
    breifast.max-distance: 2
    breifast.reject-flux-threshold: 0.1
    breifast.reject-mean-threshold: 0.1
    breifast.render.drop-pos-neg: false

  L:
    htc.size: 3072
    htc.scale: 2.4arcsec
    htc.weight: "briggs 0"
    htc.convolve.arcsec: 8
    # htfc.size: 2048
    # htfc.scale: 4.8arcsec
    # htfc.nband: 8
    lightcurves-within: 1deg
    breifast.max-distance: 1
    breifast.reject-flux-threshold: 0.1
    breifast.reject-mean-threshold: 0.1
    breifast.render.drop-pos-neg: false
