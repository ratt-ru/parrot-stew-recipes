vars:
  tron:
    bands:
      UHF:
        primary-beam-band: U
        htc.size: 3072
        htc.scale: 4.8arcsec
        htc.weight: "briggs 0"
        image-htc.make-psf: true
        stack-cds.convolve-with-mainlobe: false
        lightcurves-within: 1deg
        breifast.max-distance: 2
        breifast.candidate-threshold: 6
        breifast.detection-threshold: 6
        flag-cube.flag-excess-rms: 1.5
        breifast.reject-flux-threshold: 0.1
        breifast.reject-mean-threshold: 0.1
        breifast.procres.beam-size: 12arcsec
        breifast.procres.detect-stokes-p: true
        stokes: [I]

      L:
        primary-beam-band: L
        htc.size: 3072
        htc.scale: 2.4arcsec
        htc.weight: "briggs 0"
        image-htc.make-psf: true
        stack-cds.convolve-with-mainlobe: false
        lightcurves-within: 1deg
        breifast.max-distance: 1
        breifast.candidate-threshold: 6
        breifast.detection-threshold: 6
        flag-cube.flag-excess-rms: 1.5
        breifast.reject-flux-threshold: 0.1
        breifast.reject-mean-threshold: 0.1
        breifast.procres.detect-stokes-p: true
        lightcurves.interesting-regions: {'parrot': interesting-sources.reg}

tron:
  assign_based_on:
    obs:
      # PARROTS
      L1:
        _use: vars.tron.bands.L
        ms: ../msdir/1622491578_sdp_l0-J2009_2026-corr.ms   # L deep 1
        dir-out: obs-l1-qc2/im4htc-cad1
        stokes: [I]
        deep-image:  obs-l1-qc2/im3/im3-MFS-I-image.fits # PARROT-Lband-MFS-image.fits
        column.data: SELFCAL4_DATA
        # column.residual: CORRECTED_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        breifast.procres.beam-size: true

      L2:
        _use: vars.tron.bands.L
        ms: "../msdir/1624216341_sdp_l0-J2009_2026-corr.ms" # L deep 2
        dir-out: obs-l2-qc2/im4htc-cad1
        stokes: [I]
        deep-image:  obs-l2-qc2/im3/im3-MFS-image.fits # PARROT-Lband-MFS-image.fits
        column.data: SELFCAL4_DATA
        # column.residual: CORRECTED_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        breifast.procres.beam-size: true

      L3:
        _use: vars.tron.bands.L
        ms: "../msdir/1627405233_sdp_l0-J2009_2026-corr.ms" # L deep from U+L obs Jul 2021
        dir-out: obs-l3-qc2/im4htc-cad1
        stokes: [I]
        deep-image: PARROT-Lband-MFS-image.fits
        column.residual: CORRECTED_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        breifast.procres.beam-size: 6arcsec

      L4:
        _use: vars.tron.bands.L
        ms: "msdir/1687288333_sdp_l0-J2009_2026-corr.ms" # L deep 4
        dir-out: obs-l4-qc2/im4htc-cad1
        deep-image: PARROT-Lband-MFS-image.fits
        column.data: SELFCAL4_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        breifast.procres.beam-size: 6arcsec
        stokes: [I,Q,U,V]

      U0:
        _use: vars.tron.bands.UHF
        ms: ../msdir/1625623568_sdp_l0-J2009_2026-corr.ms  # UHF test obs Jul 2021 1h
        dir-out: obs-u0-qc2/im4htc-cad1
        deep-image: PARROT-UHF-MFS-image.fits
        column.residual: CORRECTED_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits

      U1:
        _use: vars.tron.bands.UHF
        ms: ../msdir/1627405250_sdp_l0-J2009_2026-corr.ms  # UHF from U+L obs Jul 2021
        dir-out: obs-u1-qc2/im4htc-cad1
        deep-image: obs-u1-qc2/im3/im3-MFS-I-image.fits
        column.data: SELFCAL3_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        breifast.procres.beam-size: true

      U2:
        _use: vars.tron.bands.UHF
        ms: ../msdir/1628439081_sdp_l0-J2009_2026-corr.ms  # UHF Aug 2021 9h
        dir-out: obs-u2-qc2/im4htc-cad1
        deep-image: PARROT-UHF-MFS-image.fits
        column.residual: SELFCAL4_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        stokes: [I]
        breifast.procres.beam-size: true

      U3:
        _use: vars.tron.bands.UHF
        ms: ../msdir/1643947704_sdp_l0-J2009_2026-corr.ms # UHF Feb 2022  part I
        dir-out: obs-u3-qc2/im4htc-cad1
        deep-image: PARROT-UHF-MFS-image.fits
        column.residual: SELFCAL4_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        stokes: [I]
        breifast.procres.beam-size: true

      U3b:
        _use: vars.tron.bands.UHF
        ms: ../msdir/1643969937_sdp_l0-J2009_2026-corr.ms # UHF Feb 2022  part I
        dir-out: obs-u3b-qc2/im4htc-cad1
        deep-image: PARROT-UHF-MFS-image.fits
        column.residual: CORRECTED_DATA
        breifast.avoid-mask: parrot-avoid-mask.fits
        stokes: [I]
        breifast.procres.beam-size: true

      SMC-U1:
        _use: vars.tron.bands.UHF
        ms: msdir/1581006914_sdp_l0_1024ch_SMC.ms
        dirs.sub: obs-smc-u1
        deep-image: obs-smc-u1/img_1581006914_sdp_l0_1024ch_SMC.ms_pcalmask_300k-MFS-image.fits
        column.residual: CORRECTED_DATA
        minuv-l: 250
        taper-inner-tukey: 100
        breifast.detection-threshold: 8
        breifast.reject-noise-threshold: 1.28

      WDP-E5:
        _use: vars.tron.bands.UHF
        ms: msdir/WD_pulsar/epoch5/1705730728_sdp_l0_1024ch_J1912-4410.ms
        dirs.sub: obs-wdp5
        deep-image: obs-wdp6/img_1706936255_sdp_l0_1024ch_J1912-4410.ms_pcalmask-MFS-image.fits
        column.residual: CORRECTED_DATA

      WDP-E6:
        _use: vars.tron.bands.UHF
        ms: msdir/WD_pulsar/epoch6/1706936255_sdp_l0_1024ch_J1912-4410.ms
        dir-out: obs-wdp6
        deep-image: obs-wdp6/img_1706936255_sdp_l0_1024ch_J1912-4410.ms_pcalmask-MFS-image.fits
        column.residual: CORRECTED_DATA

      3C445:
        _use: vars.tron.bands.L
        ms: msdir/3C445/1622255335_sdp_l0-3C445-corr.ms/
        dirs.sub: obs-3c445
        deep-image: obs-3c445/OD_3C445_4peel_post-MFS-image.fits

      OmCen:
        _use: vars.tron.bands.L
        ms: /net/nash/home/ianh/Globular/OmegaCen/1541903773_sdp_l0_1024ch_OmegaCen.ms
        dir-out: obs-omcen
        deep-image: obs-omcen/img_1541903773_sdp_l0_1024ch_OmegaCen.ms_DDFkMS.app.restored.fits
        breifast.candidate-threshold: 6
        breifast.detection-threshold: 7

      47Tuc:
        _use: vars.tron.bands.L
        ms: /net/nash/home/ianh/Globular/47Tuc/1529209968_sdp_l0_1024ch_47Tuc.ms
        dir-out: obs-47tuc
        deep-image: obs-47tuc/img_1529209968_sdp_l0_1024ch_47Tuc.ms_DDFkMS.app.restored.fits
        breifast.candidate-threshold: 6
        breifast.detection-threshold: 7

      T16R02C06a:
        _use: vars.tron.bands.L
        ms: mgpls/1543635069_sdp_l0-T16R02C06-corr.ms
        dirs.sub: mgpls/T16R02C06a
        use-wsclean-subtract: true
        deep-image: mgpls/T16R02C06-MFS-image.fits
        breifast.timescales: [0,15,30]

      T16R02C06b:
