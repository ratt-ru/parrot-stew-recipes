        dirs.sub: mgpls/T16R02C06b
        deep-image: mgpls/T16R02C06-MFS-image.fits
        breifast.timescales: [0,15,30]

      T16R02C04a:
        _use: vars.tron.bands.L
        ms: mgpls/1543664600_sdp_l0-T16R02C04-corr.ms
        dirs.sub: mgpls/T16R02C04a
        deep-image: mgpls/T16R02C04-MFS-image.fits
        breifast.timescales: [0,15,30]

      T16R02C04b:
        _use: vars.tron.bands.L
        ms: mgpls/1543635069_sdp_l0-T16R02C04-corr.ms
        dirs.sub: mgpls/T16R02C04b
        deep-image: mgpls/T16R02C04-MFS-image.fits
        breifast.timescales: [0,15,30]

      T16R02C02a:
        _use: vars.tron.bands.L
        ms: mgpls/1543664600_sdp_l0-T16R02C02-corr.ms
        dirs.sub: mgpls/T16R02C02a
        deep-image: mgpls/T16R02C02-MFS-image.fits
